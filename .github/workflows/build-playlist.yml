name: Build CarTV playlist

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current IPTV-org country playlist
        run: curl -fL --retry 3 --connect-timeout 20 -o base.m3u https://iptv-org.github.io/iptv/index.country.m3u

      - name: Build combined playlist
        run: |
          cp base.m3u cartv.m3u
          printf '\n' >> cartv.m3u
          cat lebanon_additions.m3u >> cartv.m3u

      - name: Commit generated playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cartv.m3u
          git diff --cached --quiet || git commit -m 'Update combined CarTV playlist'
          git push
